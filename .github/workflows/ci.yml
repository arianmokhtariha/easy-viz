# Lint, type-check and test every pull request and every push to main, on every
# Python version easy-viz supports (decision 0005).
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: CI never writes to the repository.
permissions:
  contents: read

# A new push to a PR cancels the run it makes obsolete. Runs on main are never
# cancelled, so every commit on main gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Every uv command fails if uv.lock is out of date with pyproject.toml,
      # instead of silently resolving new versions.
      UV_LOCKED: 1
    strategy:
      # Finish every version, so one failure doesn't hide the others' results.
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14", "3.15"]
    steps:
      # Actions are pinned to commit SHAs: a tag can be moved, a commit can't.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # The dev group is installed by default; the docs group (Sphinx) is not
      # needed by any check here.
      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy src

      - name: Test
        run: uv run pytest

  # The lower bounds in pyproject.toml promise that easy-viz works with those
  # versions. The checks job only tests the newest (locked) ones, so this job
  # installs every runtime dependency at its lowest allowed version and tests
  # against that, on the oldest supported Python (where old releases are likeliest
  # to exist). Dev tools stay locked: they never reach users.
  lowest:
    name: Lowest dependencies (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_LOCKED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      # Reads the runtime dependencies and extras from pyproject.toml and picks the
      # lowest version each lower bound allows. --upgrade makes uv re-resolve:
      # without it, the newer locked versions already satisfy the bounds and
      # nothing changes.
      - name: Downgrade runtime dependencies to their lower bounds
        run: >-
          uv pip install -r pyproject.toml --all-extras --resolution lowest-direct
          --upgrade

      # Fails if a dependency is not at its lower bound, so the job can never pass
      # while testing newer versions than it claims.
      - name: Check that every runtime dependency is at its lower bound
        run: |
          uv run --no-sync python - <<'PY'
          import tomllib
          from importlib.metadata import version
          from packaging.requirements import Requirement
          from packaging.version import Version

          with open("pyproject.toml", "rb") as file:
              project = tomllib.load(file)["project"]
          extras = project.get("optional-dependencies", {}).values()
          wanted = project["dependencies"] + [r for extra in extras for r in extra]
          for req in map(Requirement, wanted):
              lows = [Version(s.version) for s in req.specifier if s.operator == ">="]
              installed = Version(version(req.name))
              print(f"{req.name}: {installed} (lower bound {lows[0] if lows else '-'})")
              if lows and installed != lows[0]:
                  raise SystemExit(f"{req.name} {installed} is not at its lower bound")
          PY

      # --no-sync keeps the downgraded versions instead of restoring the lock.
      - name: Test
        run: uv run --no-sync pytest
