# Lint, type-check and test every pull request and every push to main, on every
# Python version easy-viz supports (decision 0005).
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: CI never writes to the repository.
permissions:
  contents: read

# A new push to the same branch or PR cancels the run it makes obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Finish every version, so one failure doesn't hide the others' results.
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # --locked fails if uv.lock is out of date with pyproject.toml. The docs group
      # (Sphinx) is left out: no check here needs it.
      - name: Install dependencies
        run: uv sync --locked --all-extras --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy src

      - name: Test
        run: uv run pytest
